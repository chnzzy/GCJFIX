plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gcjfix.xposed'
    compileSdk 34

    defaultConfig {
        applicationId "com.gcjfix.xposed"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // 经典 Xposed API：Vector / LSPosed 2.x / 老 LSPosed 1.9.2 都能加载
    compileOnly 'de.robv.android.xposed:api:82'
}
